networks:
  backend:
  db:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - db
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 2G
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 15s
      interval: 10s
      timeout: 15s
      retries: 5
  app:
    build: .
    restart: unless-stopped
    command: ["uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    networks:
      - backend
      - db
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app